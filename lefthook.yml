pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: bunx biome check --write --staged --no-errors-on-unmatched --files-ignore-unknown=true
      stage_fixed: true

    check-boundaries:
      glob: "apps/*/src/**/*.{ts,tsx}"
      run: bun run check-boundaries

    check-tokens:
      glob: "{apps,packages/ui}/src/**/*.{ts,tsx,css}"
      run: bun run check-tokens

    check-journeys:
      glob: "{docs/journeys/**/*.yaml,**/*.{test,spec}.{ts,tsx}}"
      run: bun run check-journeys

    check-types:
      glob: "*.{ts,tsx}"
      run: TURBO_UI=0 bunx turbo run check-types --filter='...[HEAD]'
