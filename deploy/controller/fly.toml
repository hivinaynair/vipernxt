# Set app before deploying. Run from the kit root with --config deploy/controller/fly.toml.
app = "REPLACE_WITH_YOUR_FACTORY_APP"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"
[build]
  dockerfile = "Dockerfile"
[env]
  PORT = "8080"
  FACTORY_DATA = "/data"
  FACTORY_CONFIG = "/data/controller.json"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/healthz"
[[mounts]]
  source = "factory_data"
  destination = "/data"
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
