display_information:
  name: Eve Factory
  description: Factory holds, evidence, and bounded owner decisions
  background_color: "#202938"
features:
  bot_user:
    display_name: Eve Factory
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - groups:history
      - metadata.message:read
settings:
  event_subscriptions:
    request_url: https://your-factory.vercel.app/callbacks/slack
    bot_events:
      - message.groups
  interactivity:
    is_enabled: true
    request_url: https://your-factory.vercel.app/callbacks/slack
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
