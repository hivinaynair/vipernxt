# Stack recipe. Edit this file when the default stack changes.
# Compose resolves package versions at scaffold time (`@latest` within
# `majors`). The lockfile lives in the site repo, not here.
#
# This is not a second GitHub template. There is no fat tree to clone and
# strip. After U5, `bun scripts/compose.mjs --add web --add db` prints the
# commands; overlays under this folder are the opinions the CLIs do not
# encode (feature folders, `@/env`, shadcn in `packages/ui`).

packageManager: bun
monorepo: turborepo

# Pin the major so "latest" cannot jump a breaking line until you bump this.
majors:
  bun: "1.4"
  next: 16
  react: 19

surfaces:
  web:
    implies: [ui]
    path: apps/web
    command: bunx create-next-app@latest
    args:
      - apps/web
      - --yes
      - --ts
      - --tailwind
      - --app
      - --src-dir
      - --import-alias
      - "@/*"
      - --use-bun
      - --turbopack
    folders: [app, features, shared]
    env: "@/env"
    # compose --apply always writes apps/web/src/env.ts, which imports these.
    # They are not optional facets: without them the app does not typecheck.
    deps:
      - "@t3-oss/env-nextjs"
      - zod
    auth: clerk
    jobs: vercel-workflows
    analytics: posthog
    email: resend
    files: vercel-blob
    lint: biome
    # Intended e2e layer. Nothing scaffolds it yet, so a composed clone has no
    # Playwright and no traces — evidence for the first slice is the merge bar,
    # bun test, and screenshots from `next dev`. Recorded so the choice is made
    # when someone does add it, not so compose pretends it is there.
    e2e: playwright (not composed)
  ui:
    path: packages/ui
    # No scaffold command. `shadcn init` is a create-a-project flow: it prompts
    # for a framework template and would write a second project over the
    # overlay. The overlay under overlays/ui/ already supplies package.json,
    # components.json, tsconfig.json, globals.css and lib/utils.ts — which is
    # everything init would have produced for a non-app package.
    add: bun run ui:add --
  db:
    path: packages/db
    host: neon
    orm: drizzle
    serverOnly: true
    # No scaffold command and no `bun add`. The overlay's package.json already
    # declares every dependency at a pinned version. `bun add drizzle-orm`
    # resolved `latest` instead and rewrote the pin to the 0.45 line, while
    # drizzle-kit stayed on 1.x from devDependencies — so every fresh clone got
    # a drizzle-kit that could not load drizzle-orm. `bun install` is enough.
  agent:
    path: apps/agent
    command: bunx eve@latest
    args:
      - init
      - apps/agent
    when: "U5 surfaces includes agent — judgment steps, not script steps"

# Facets of `web`. `--without auth` / `--without jobs` / `--without analytics`
# / `--without email` / `--without files` drop them from the plan.
facets:
  auth:
    on: web
    command: bun add
    args:
      - "@clerk/nextjs"
  jobs:
    on: web
    command: bun add
    args:
      - workflow
  analytics:
    on: web
    command: bun add
    args:
      - posthog-js
      - posthog-node
  email:
    on: web
    command: bun add
    args:
      - resend
  files:
    on: web
    command: bun add
    args:
      - "@vercel/blob"

# Filled at setup, not compose. EU / Asia is a region flag, not a template.
setup:
  neon:
    cli: neonctl projects create
    regionFlag: --region
    default: aws-us-east-1
    regions:
      - aws-us-east-1
      - aws-eu-central-1
      - aws-eu-west-1
      - aws-ap-southeast-1
      - aws-ap-northeast-1
  vercel:
    note: Record VERCEL_REGION in .env.playbook. Project region is a Vercel setting, not a second template.
  env: ".env.playbook + apps/web/.env.local via setup.sh. Never invent keys; env.ts is the schema."

overlays:
  - bun-only
  - feature-folders
  - ui-in-packages
  - env-module
  - check-boundaries
  - ui-gate
  - analytics
  - email
  - files
  - server-only-db
  - judgment-gate
